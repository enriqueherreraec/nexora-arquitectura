[metadata]
name = nexora_server_stubs
version = 1.0.0
description = Contrato formal OpenAPI para el Sistema Web de Orientación Vocacional Nexora. Define las cuatro operaciones fundamentales del alcance arquitectónico acordado: autenticación de estudiantes, registro transaccional de evaluaciones Likert, consulta de resultados vigentes y despacho del informe PDF por correo electrónico.
long_description = file: README.md
keywords = OpenAPI Nexora API - Orientación Vocacional
python_requires = >= 3.10.*
classifiers =
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10

[options]
install_requires = fastapi[all]
setup_requires = setuptools
package_dir = =src
packages = find_namespace:

[options.packages.find]
where = src
