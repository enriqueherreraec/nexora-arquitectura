name: CI/CD Nexora - Integración y Despliegue Continuo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-backend:
    name: CI Backend (Pruebas, Linter y Sintaxis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_test_semana2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias académicas y del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Verificar calidad de código con Flake8 (Cero violaciones)
        run: |
          flake8 src tests

      - name: Ejecutar suite de pruebas de Semana 2 (PostgreSQL aislado)
        env:
          ENVIRONMENT: testing
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres_test_password
          DB_NAME: nexora_test_semana2
          SECRET_KEY: nexora_test_synthetic_secret_key_testing_only_2026_xyz
          MODO_PRUEBAS_SIMULACION_CORREO: "true"
        run: |
          pytest tests/ -v

      - name: Compilar y validar sintaxis de la suite completa del backend
        run: |
          python -m py_compile backend/app/main.py backend/app/core/config.py backend/app/core/database.py backend/app/api/v1/health.py backend/scripts/seed_db.py

  ci-frontend:
    name: CI Frontend (TypeScript & Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend (tsc -b && vite build)
        working-directory: frontend
        run: npm run build

  cd-deploy:
    name: CD Despliegue en Render (Producción)
    needs: [ci-backend, ci-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar Deploy Hook de Backend en Render
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "Notificando a Render para desplegar el servicio Backend..."
            curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
            echo "Webhook de Backend ejecutado exitosamente."
          else
            echo "Deploy Hook de Backend no configurado en Secrets. El servicio se actualizará mediante Auto-Deploy de Render conectado a la rama main."
          fi

      - name: Disparar Deploy Hook de Frontend en Render
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "Notificando a Render para desplegar el Static Site Frontend..."
            curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
            echo "Webhook de Frontend ejecutado exitosamente."
          else
            echo "Deploy Hook de Frontend no configurado en Secrets. El sitio estático se actualizará mediante Auto-Deploy de Render conectado a la rama main."
          fi
